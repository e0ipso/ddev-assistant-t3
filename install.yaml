name: assistant-t3

project_files:
  - commands/web/t3

post_install_actions:
  - |
    #ddev-description:Render Assistant T3 DDEV configuration
    set -eu

    env_file=".env.assistant-t3"

    ensure_env_var() {
      key="$1"
      value="$2"
      if [ ! -f "${env_file}" ] || ! grep -Eq "^${key}=" "${env_file}"; then
        printf '%s=%s\n' "${key}" "${value}" >> "${env_file}"
      fi
    }

    read_env_var() {
      key="$1"
      [ -f "${env_file}" ] || return 0
      awk -v key="${key}" '
        BEGIN { FS = "=" }
        $1 == key {
          value = substr($0, index($0, "=") + 1)
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
          gsub(/^"|"$/, "", value)
          gsub(/^'\''|'\''$/, "", value)
          print value
          exit
        }
      ' "${env_file}"
    }

    validate_port() {
      name="$1"
      port="$2"
      case "${port}" in
        ''|*[!0-9]*)
          echo "assistant-t3: ${name} must be a numeric TCP port, got '${port}'" >&2
          exit 1
          ;;
      esac
      if [ "${port}" -lt 1 ] || [ "${port}" -gt 65535 ]; then
        echo "assistant-t3: ${name} must be between 1 and 65535, got '${port}'" >&2
        exit 1
      fi
    }

    validate_bind_address() {
      address="$1"
      case "${address}" in
        \[*\])
          # IPv6 literal, docker requires the brackets.
          return 0
          ;;
      esac
      octets="$(printf '%s' "${address}" | awk -F. '
        NF != 4 { print "invalid"; exit }
        {
          for (i = 1; i <= 4; i++) {
            if ($i !~ /^[0-9]+$/ || $i > 255) { print "invalid"; exit }
          }
          print "valid"
        }
      ')"
      if [ "${octets}" != "valid" ]; then
        echo "assistant-t3: ASSISTANT_T3_DIRECT_BIND_ADDRESS entries must be an IPv4 address or a bracketed IPv6 address, got '${address}'" >&2
        exit 1
      fi
    }

    if [ ! -f "${env_file}" ]; then
      {
        echo "#ddev-generated"
        echo "# User-editable Assistant T3 add-on configuration."
        echo "# Re-run 'ddev add-on get e0ipso/ddev-assistant-t3' and 'ddev restart' after changing port or version values."
        echo "# ASSISTANT_T3_DIRECT_BIND_ADDRESS accepts a comma-separated list of host"
        echo "# addresses. Add a Tailscale IP to reach T3 from the tailnet, use 0.0.0.0 for"
        echo "# every interface, or leave it empty to publish nothing outside ddev-router."
      } > "${env_file}"
    fi

    if [ -f docker-compose.assistant-t3.yaml ] && grep -q "#ddev-generated" docker-compose.assistant-t3.yaml; then
      rm -f docker-compose.assistant-t3.yaml
    fi

    ensure_env_var "ASSISTANT_T3_VERSION" "latest"
    ensure_env_var "ASSISTANT_T3_HTTP_PORT" ""
    ensure_env_var "ASSISTANT_T3_HTTPS_PORT" ""
    ensure_env_var "ASSISTANT_T3_CONTAINER_PORT" "3773"
    ensure_env_var "ASSISTANT_T3_DIRECT_BIND_ADDRESS" "127.0.0.1"
    ensure_env_var "ASSISTANT_T3_DIRECT_PORT" ""

    # DDEV loads .ddev/.env.* into the environment of these actions, so a value
    # in the host environment, as in
    # "ASSISTANT_T3_GIT_EXCLUDE=true ddev add-on get ...", only counts on the
    # first install. Change it later with "ddev dotenv set".
    ensure_env_var "ASSISTANT_T3_GIT_EXCLUDE" "${ASSISTANT_T3_GIT_EXCLUDE:-false}"

    sitename="${DDEV_SITENAME:-}"
    if [ -z "${sitename}" ] && [ -f "config.yaml" ]; then
      sitename="$(awk -F: '/^name:/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit }' config.yaml)"
    fi
    if [ -z "${sitename}" ]; then
      echo "assistant-t3: unable to determine DDEV project name for deterministic port calculation" >&2
      exit 1
    fi

    hash="$(printf '%s' "${sitename}" | cksum | awk '{print $1}')"
    offset="$(( (hash % 4500) * 2 ))"
    calculated_http_port="$(( 20000 + offset ))"
    calculated_https_port="$(( calculated_http_port + 1 ))"
    calculated_direct_port="$(( 10000 + offset ))"

    git_exclude="$(read_env_var ASSISTANT_T3_GIT_EXCLUDE)"
    case "${git_exclude:-false}" in
      true|false) ;;
      *)
        echo "assistant-t3: ASSISTANT_T3_GIT_EXCLUDE must be true or false, got '${git_exclude}'" >&2
        exit 1
        ;;
    esac

    version="$(read_env_var ASSISTANT_T3_VERSION)"
    http_port="$(read_env_var ASSISTANT_T3_HTTP_PORT)"
    https_port="$(read_env_var ASSISTANT_T3_HTTPS_PORT)"
    container_port="$(read_env_var ASSISTANT_T3_CONTAINER_PORT)"
    direct_bind_addresses="$(read_env_var ASSISTANT_T3_DIRECT_BIND_ADDRESS)"
    direct_port="$(read_env_var ASSISTANT_T3_DIRECT_PORT)"

    version="${version:-latest}"
    http_port="${http_port:-${calculated_http_port}}"
    https_port="${https_port:-${calculated_https_port}}"
    container_port="${container_port:-3773}"
    direct_port="${direct_port:-${calculated_direct_port}}"

    validate_port "ASSISTANT_T3_HTTP_PORT" "${http_port}"
    validate_port "ASSISTANT_T3_HTTPS_PORT" "${https_port}"
    validate_port "ASSISTANT_T3_CONTAINER_PORT" "${container_port}"

    if [ "${http_port}" = "${https_port}" ]; then
      echo "assistant-t3: ASSISTANT_T3_HTTP_PORT and ASSISTANT_T3_HTTPS_PORT must differ" >&2
      exit 1
    fi

    cat > config.assistant-t3.yaml <<EOF
    #ddev-generated
    # Expose T3 from the web container through stable project-specific DDEV ports.
    web_extra_exposed_ports:
      - name: assistant-t3
        container_port: ${container_port}
        http_port: ${http_port}
        https_port: ${https_port}
    EOF

    # ddev-router terminates TLS and tells T3 the original scheme in
    # X-Forwarded-Proto, but for WebSocket upgrades Traefik sends "wss", and T3
    # only treats "https" as TLS. T3 then checks the desktop app's DPoP proof
    # against an http:// URL, rejects it with url_mismatch, and the app cannot
    # open its WebSocket. Route the HTTPS port through a middleware that always
    # sends "https". DDEV deletes #ddev-generated files from traefik/config on
    # every start, so this file carries its own marker instead.
    traefik_config="traefik/config/assistant-t3.yaml"
    traefik_marker="# assistant-t3-generated"
    if [ ! -f "${traefik_config}" ] || grep -qxF "${traefik_marker}" "${traefik_config}"; then
      host_regexp="^$(printf '%s' "${sitename}" | sed 's/\./\\./g')\\.ddev\\.site\$"
      mkdir -p traefik/config
      cat > "${traefik_config}" <<EOF
    #ddev-silent-no-warn
    ${traefik_marker}
    # Sends X-Forwarded-Proto: https to T3 for WebSocket upgrades on the HTTPS
    # port too, so T3 accepts the desktop app's DPoP proofs. Remove the marker
    # line above to keep your own changes to this file.
    http:
      middlewares:
        ${sitename}-assistant-t3-forwarded-https:
          headers:
            customRequestHeaders:
              X-Forwarded-Proto: https
      routers:
        ${sitename}-assistant-t3-https:
          entrypoints:
            - http-${https_port}
          rule: HostRegexp(\`${host_regexp}\`)
          priority: 1000
          service: "${sitename}-web-${container_port}"
          middlewares:
            - ${sitename}-assistant-t3-forwarded-https
          tls: true
    EOF
    fi

    if [ -n "${direct_bind_addresses}" ]; then
      validate_port "ASSISTANT_T3_DIRECT_PORT" "${direct_port}"

      if [ "${direct_port}" = "${http_port}" ] || [ "${direct_port}" = "${https_port}" ]; then
        echo "assistant-t3: ASSISTANT_T3_DIRECT_PORT must differ from the ddev-router HTTP and HTTPS ports, got '${direct_port}'" >&2
        exit 1
      fi

      # Validate every address before writing, so a rejected list never leaves a
      # half-written compose file behind for DDEV to read.
      address_list="$(printf '%s' "${direct_bind_addresses}" | tr ',' ' ')"
      seen_addresses=""
      address_count=0
      wildcard_address=""
      for address in ${address_list}; do
        validate_bind_address "${address}"
        address_count="$(( address_count + 1 ))"

        for seen in ${seen_addresses}; do
          if [ "${seen}" = "${address}" ]; then
            echo "assistant-t3: ASSISTANT_T3_DIRECT_BIND_ADDRESS lists '${address}' twice; docker cannot publish the same address and port twice" >&2
            exit 1
          fi
        done
        seen_addresses="${seen_addresses} ${address}"

        case "${address}" in
          0.0.0.0|'[::]')
            wildcard_address="${address}"
            ;;
        esac
      done

      if [ -n "${wildcard_address}" ] && [ "${address_count}" -gt 1 ]; then
        echo "assistant-t3: ASSISTANT_T3_DIRECT_BIND_ADDRESS combines '${wildcard_address}' with other addresses; ${wildcard_address} already covers every interface and the bindings would collide on port ${direct_port}" >&2
        exit 1
      fi
    fi

    # DDEV v1.25.6 stopped mounting the shared ddev-global-cache volume in the
    # web container, so T3CODE_HOME would sit on the container's writable layer
    # and lose pairings and server identity on every recreate. A per-project
    # volume keeps that state, and keeps one project's T3 credentials out of
    # other projects' containers. On older DDEV versions it hides the
    # assistant-t3 directory of the still-mounted ddev-global-cache volume.
    # Keep the volume entry unquoted: "ddev t3 start" reads quoted list entries
    # in this file as direct publishes.
    {
      echo "#ddev-generated"
      echo "services:"
      echo "  web:"
      echo "    volumes:"
      echo "      - assistant-t3-state:/mnt/ddev-global-cache/assistant-t3"
      if [ -n "${direct_bind_addresses}" ]; then
        echo "    # Publishes the T3 container port straight on the host, bypassing ddev-router."
        echo "    # ddev-router only answers requests whose Host header matches a project hostname"
        echo "    # and, unless router_bind_all_interfaces is enabled globally, only listens on"
        echo "    # localhost. Neither holds for clients arriving over Tailscale or the LAN."
        echo "    ports:"
        for address in ${address_list}; do
          echo "      - \"${address}:${direct_port}:${container_port}\""
        done
      fi
      echo ""
      echo "volumes:"
      echo "  assistant-t3-state:"
      echo '    name: "ddev-${DDEV_SITENAME}-assistant"'
    } > docker-compose.assistant-t3.yaml

    # Docker caches the install layer by instruction text, so "t3@latest" would
    # never move past the version installed on the first build. For dist-tags,
    # ADD the registry metadata for that tag: BuildKit re-fetches it on every
    # build and only invalidates the install layer when the tag points elsewhere.
    cache_bust=""
    if printf '%s' "${version}" | grep -Eq '^[A-Za-z][A-Za-z0-9._-]*$'; then
      cache_bust="ADD https://registry.npmjs.org/t3/${version} /tmp/assistant-t3-release.json"
    fi

    # Since 0.0.41 the npm package is a launcher for T3's prebuilt runtime, so
    # the build needs no compilers. Don't run "t3" here, not even "t3 --version":
    # since 0.1.1 the launcher first downloads that runtime into T3CODE_HOME,
    # which would bake a copy into the image that "ddev t3 start" never uses,
    # since it points T3CODE_HOME at the global cache. "npm ls" prints the
    # installed version without running it.
    mkdir -p web-build t3
    cat > web-build/Dockerfile.assistant-t3 <<EOF
    #ddev-generated
    ${cache_bust}
    RUN set -eux; \\
        if ! command -v npm >/dev/null 2>&1; then \\
          echo "assistant-t3: npm is required to install T3 in the web container" >&2; \\
          exit 1; \\
        fi; \\
        npm install --global "t3@${version}"; \\
        command -v t3 >/dev/null; \\
        npm ls --global t3
    EOF

    if [ ! -f t3/settings.json ] || [ "$(tr -d '[:space:]' < t3/settings.json)" = "{}" ]; then
      cat > t3/settings.json <<'EOF'
    {
      "defaultThreadEnvMode": "local",
      "newWorktreesStartFromOrigin": false
    }
    EOF
    fi

    # Personal install: with ASSISTANT_T3_GIT_EXCLUDE=true, list every file this
    # add-on creates in the clone's .git/info/exclude. Git then leaves them out of
    # "git status" and "git add .ddev" for this developer only, and the project
    # repository, and so every other developer's container, stays untouched.
    # Linked worktrees share that exclude file with the main checkout.
    update_git_exclude() {
      if ! command -v git >/dev/null 2>&1 || [ "$(git rev-parse --is-inside-work-tree 2>/dev/null)" != "true" ]; then
        return 0
      fi
      prefix="$(git rev-parse --show-prefix)"
      exclude_file="$(git rev-parse --git-path info/exclude)"
      begin_marker="# BEGIN ddev-assistant-t3 personal install"
      end_marker="# END ddev-assistant-t3 personal install"
      if [ ! -f "${exclude_file}" ] && [ "$#" -eq 0 ]; then
        return 0
      fi
      mkdir -p "$(dirname "${exclude_file}")"
      tmp_file="$(mktemp)"
      if [ -f "${exclude_file}" ]; then
        awk -v begin="${begin_marker}" -v end="${end_marker}" '
          $0 == begin { skip = 1; next }
          $0 == end { skip = 0; next }
          !skip
        ' "${exclude_file}" > "${tmp_file}"
      fi
      if [ "$#" -gt 0 ]; then
        {
          echo "${begin_marker}"
          for path in "$@"; do
            echo "/${prefix}${path}"
          done
          echo "${end_marker}"
        } >> "${tmp_file}"
      fi
      cat "${tmp_file}" > "${exclude_file}"
      rm -f "${tmp_file}"
    }

    excluded_paths=".env.assistant-t3 addon-metadata/assistant-t3/ commands/web/t3 config.assistant-t3.yaml docker-compose.assistant-t3.yaml t3/ traefik/config/assistant-t3.yaml web-build/Dockerfile.assistant-t3"
    if [ "${git_exclude:-false}" = "true" ]; then
      # shellcheck disable=SC2086
      update_git_exclude ${excluded_paths}
    else
      update_git_exclude
    fi

  - |
    #ddev-description:Check that a personal install has no committed files
    #ddev-warning-exit-code: 2
    set -eu
    # Excluding has no effect on files git already tracks, so a personal install
    # in a project that commits the add-on would hide only newly added files.
    # "ddev dotenv set" quotes values, so strip quotes like read_env_var does.
    setting="$(awk -F= '$1 == "ASSISTANT_T3_GIT_EXCLUDE" { value = substr($0, index($0, "=") + 1); gsub(/^[[:space:]"'\'']+|[[:space:]"'\'']+$/, "", value); print value; exit }' .env.assistant-t3)"
    [ "${setting}" = "true" ] || exit 0
    command -v git >/dev/null 2>&1 || exit 0
    [ "$(git rev-parse --is-inside-work-tree 2>/dev/null)" = "true" ] || exit 0
    tracked="$(git ls-files -- .env.assistant-t3 addon-metadata/assistant-t3/ commands/web/t3 config.assistant-t3.yaml docker-compose.assistant-t3.yaml t3/ traefik/config/assistant-t3.yaml web-build/Dockerfile.assistant-t3)"
    if [ -n "${tracked}" ]; then
      echo "assistant-t3: ASSISTANT_T3_GIT_EXCLUDE=true, but git already tracks these add-on files:" >&2
      printf '  %s\n' ${tracked} >&2
      echo "Set ASSISTANT_T3_GIT_EXCLUDE=false if your team commits this add-on." >&2
      exit 2
    fi

# post_install_actions write these files, so DDEV doesn't track them as
# project_files. Like DDEV does for project_files, skip any file whose
# #ddev-generated marker was removed. .env.assistant-t3 and t3/settings.json
# hold user settings, so they stay for a later reinstall to pick up.
removal_actions:
  - |
    #ddev-description:Remove generated Assistant T3 files
    set -eu
    for file in config.assistant-t3.yaml docker-compose.assistant-t3.yaml web-build/Dockerfile.assistant-t3; do
      if [ -f "${file}" ] && grep -q "#ddev-generated" "${file}"; then
        rm -f "${file}"
      fi
    done
    if [ -f traefik/config/assistant-t3.yaml ] && grep -qxF "# assistant-t3-generated" traefik/config/assistant-t3.yaml; then
      rm -f traefik/config/assistant-t3.yaml
    fi

    # A personal install excluded the add-on's files from git. Keep excluding the
    # user settings that removal leaves behind, so they don't turn up as new
    # files, and drop the exclude block once nothing is left.
    if command -v git >/dev/null 2>&1 && [ "$(git rev-parse --is-inside-work-tree 2>/dev/null)" = "true" ]; then
      prefix="$(git rev-parse --show-prefix)"
      exclude_file="$(git rev-parse --git-path info/exclude)"
      begin_marker="# BEGIN ddev-assistant-t3 personal install"
      end_marker="# END ddev-assistant-t3 personal install"
      if [ -f "${exclude_file}" ] && grep -qxF "${begin_marker}" "${exclude_file}"; then
        tmp_file="$(mktemp)"
        awk -v begin="${begin_marker}" -v end="${end_marker}" '
          $0 == begin { skip = 1; next }
          $0 == end { skip = 0; next }
          !skip
        ' "${exclude_file}" > "${tmp_file}"
        leftovers=""
        for path in .env.assistant-t3 t3/; do
          if [ -e "${path%/}" ]; then
            leftovers="${leftovers} ${path}"
          fi
        done
        if [ -n "${leftovers}" ]; then
          {
            echo "${begin_marker}"
            for path in ${leftovers}; do
              echo "/${prefix}${path}"
            done
            echo "${end_marker}"
          } >> "${tmp_file}"
        fi
        cat "${tmp_file}" > "${exclude_file}"
        rm -f "${tmp_file}"
      fi
    fi

ddev_version_constraint: '>= v1.24.10'
